name: CI

# Verify and build on every push and pull request to the main branches.
# Mirrors the "verify-and-build" gate: install → typecheck → lint → build.
on:
  push:
    branches: [main, master, develop, development]
  pull_request:
    branches: [main, master, develop, development]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Keep Next's telemetry quiet in CI.
          NEXT_TELEMETRY_DISABLED: "1"
